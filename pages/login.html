<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 政务系统App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .login-container {
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .login-logo {
        width: 80px;
        height: 80px;
        margin: 60px auto 20px;
        background-color: var(--primary-color);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
      }

      .login-title {
        text-align: center;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 40px;
      }

      .code-button {
        min-width: 110px;
        padding: 0 12px;
        height: 44px;
        background-color: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
      }

      .code-button:disabled {
        background-color: #bfbfbf;
        cursor: not-allowed;
      }

      .other-login {
        margin-top: auto;
        padding-bottom: 40px;
      }

      .divider {
        display: flex;
        align-items: center;
        color: var(--gray-dark);
        margin: 30px 0;
      }

      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background-color: #e8e8e8;
      }

      .divider span {
        padding: 0 16px;
        font-size: 14px;
      }

      .login-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 70px;
        font-size: 12px;
      }

      .login-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="status-bar-time">12:30</span>
      <div class="status-bar-icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-three-quarters"></i>
      </div>
    </div>

    <div class="app-content">
      <div class="login-container">
        <div class="login-logo">
          <i class="fas fa-landmark"></i>
        </div>
        <h1 class="login-title">智慧政务通</h1>

        <form data-action="login">
          <div class="form-group">
            <div class="relative">
              <input
                type="tel"
                class="form-input pl-12"
                placeholder="请输入手机号码"
                maxlength="11"
                required
              />
              <i
                class="fas fa-mobile-alt absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-dark text-xl"
              ></i>
            </div>
          </div>

          <div class="form-group">
            <div class="flex">
              <div class="relative flex-1">
                <input
                  type="text"
                  class="form-input pl-12"
                  placeholder="请输入验证码"
                  required
                />
                <i
                  class="fas fa-shield-alt absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-dark"
                ></i>
              </div>
              <button
                type="button"
                class="code-button ml-3"
                onclick="startCountdown(this)"
              >
                获取验证码
              </button>
            </div>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-block">
              登录
            </button>
          </div>

          <div class="flex justify-between text-sm">
            <a href="#" class="text-secondary-color">密码登录</a>
            <a href="#" class="text-secondary-color">注册账号</a>
          </div>
        </form>

        <div class="divider">
          <span>其他登录方式</span>
        </div>

        <div class="other-login">
          <div class="flex justify-center space-x-8">
            <div class="login-option">
              <div class="login-icon text-blue-500">
                <i class="fab fa-weixin"></i>
              </div>
              <span>微信</span>
            </div>

            <div class="login-option">
              <div class="login-icon text-red-500">
                <i class="fas fa-id-card"></i>
              </div>
              <span>电子证照</span>
            </div>

            <div class="login-option">
              <div class="login-icon text-yellow-500">
                <i class="fas fa-fingerprint"></i>
              </div>
              <span>指纹登录</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/main.js"></script>
  </body>
</html>
